# Xcode project definition — the source of truth for Karaoke.xcodeproj.
#
# The .xcodeproj is a generated artifact and is gitignored. Regenerate with:
#     cd Karaoke && xcodegen generate
#
# Covers tasks T001-T008 in specs/001-youtube-karaoke-ios/tasks.md.

name: Karaoke

options:
  bundleIdPrefix: com.karaoke.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "2700"

# T002 — Swift 6 language mode with strict concurrency, applied project-wide.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Device builds need a team. Override for another developer with
    # `xcodebuild DEVELOPMENT_TEAM=...`; simulator builds ignore it.
    DEVELOPMENT_TEAM: 48T636CL5V
    SWIFT_TREAT_WARNINGS_AS_ERRORS: false
    GCC_TREAT_WARNINGS_AS_ERRORS: false
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEAD_CODE_STRIPPING: true
    CLANG_ANALYZER_NONNULL: true
    ENABLE_MODULE_VERIFIER: true
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

# T005 — YouTubeKit (MIT) for on-device source resolution.
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: 0.4.10

targets:
  Karaoke:
    type: application
    platform: iOS
    sources:
      - path: Karaoke
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: YouTubeKit
    info:
      path: Karaoke/Info.plist
      properties:
        CFBundleDisplayName: Karaoke
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"

        # T003 — background audio. Without this iOS suspends the app when the
        # screen locks, which is the normal state of an iPad at a party.
        # Also the prerequisite for the now-playing surface and transport
        # controls (FR-015, SC-010).
        UIBackgroundModes:
          - audio

        # T004 — NSMicrophoneUsageDescription is deliberately ABSENT.
        # Its absence is the enforcement mechanism for FR-010: touching the
        # microphone without this key crashes at the OS level, which turns
        # "we promise not to record" into a constraint the OS enforces.
        # The PA speaker owns the microphone. Do not add this key.

        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karaoke.personal.Karaoke
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
        # Single 1024x1024 source; iOS derives every other size. The art is
        # kept at specs/icon-app.png and downscaled into the asset catalog.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      # T008 — SwiftLint. Degrades to a notice when not installed so a fresh
      # checkout still builds; install with `brew install swiftlint`.
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint --config "$SRCROOT/.swiftlint.yml"
          else
            echo "note: swiftlint not installed; skipping. brew install swiftlint"
          fi

  KaraokeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KaraokeTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: Karaoke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karaoke.personal.KaraokeTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Karaoke:
    build:
      targets:
        Karaoke: all
        KaraokeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KaraokeTests
    archive:
      config: Release
